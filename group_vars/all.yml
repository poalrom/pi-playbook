---
# =============================================================================
# Raspberry Pi Home Server Configuration Variables
# =============================================================================

# =============================================================================
# Common Infrastructure Parameters
# =============================================================================

# Network Configuration
network:
  local_subnet: "192.168.178.0/24"
  pi_ip: "192.168.178.112"

# User Management
users:
  admin_user: "home-pi"

# SSH Configuration
ssh:
  port: 2312
  disable_password_auth: true
  public_key_path: "~/.ssh/id_ed25519.pub"

# Firewall Rules
firewall:
  ssh_port: 2312
  allow_http: true
  allow_https: true
  samba_ports:
    udp: [137, 138]
    tcp: [139, 445]

# Fail2Ban Configuration
fail2ban:
  ssh_maxretry: 3
  ssh_bantime: "1h"
  ssh_findtime: "10m"

# External Storage
storage:
  device: "/dev/sda2"
  mount_point: "/media/pi/home"
  filesystem: "exfat"

# Placed separately to avoid recursion templating
log_directory: "{{ storage.mount_point }}/log"
shared_directory: "{{ storage.mount_point }}/samba/shared"

# Shell guard sourced by every backup script before it creates a directory or
# opens a log file. The external disk is mounted with `nofail`, so the system
# boots without it whenever the enclosure is absent or slow to appear. The
# guard aborts the backup in that case, so the backup cannot recreate the tree
# on the root SD card and fill it.
storage_guard_script: "/usr/local/lib/pi-playbook/require-storage-mount.sh"

# Docker Configuration
docker:
  stacks_directory: "/opt/stacks"
  # Container stdout/stderr uses the json-file driver, which keeps no size limit
  # by default. One otbr log had grown to 5.2G on the root SD card. Cap every
  # container: the worst case per container is log_max_size * log_max_file.
  log_max_size: "20m"
  log_max_file: 3

# Security Settings
security:
  ufw_default_incoming: "deny"
  ufw_default_outgoing: "allow"
  # ufw-docker integration for Docker container firewall control
  ufw_docker_enabled: true

# System Settings
system:
  timezone: "Europe/Amsterdam"
  locale: "en_US.UTF-8"
  # Persist the systemd journal so an unclean shutdown can be diagnosed after the
  # fact; capped well below the free space on the root filesystem.
  journal:
    storage: "persistent"
    max_use: "200M"

# =============================================================================
# Role-Specific Configuration Parameters
# =============================================================================

# DDNS Configuration
ddns:
  domain: "{{ ddns_domain }}"
  service_url: "https://ipv4.myaddr.tools/update"
  update_interval: "hourly"

# Immich Photo Management
immich:
  port: 2283
  domain: "photo.{{ ddns_domain }}"
  public_access: true
  config_path: "{{ docker.stacks_directory }}/immich"
  library_directory: "{{ storage.mount_point }}/immich/library"
  # Placed to the main storage to avoid permission conflicts
  database_directory: "{{ docker.stacks_directory }}/immich/database"
  # Backup Configuration
  backup:
    local_directory: "{{ storage.mount_point }}/backups/immich"
    retention_days: 3
    rclone_path: "immich-backups"
    log_file: "{{ log_directory }}/immich-backup-rclone.log"

rclone:
  remote: "yandex-disk"

# Nginx Proxy Manager
nginx_proxy_manager:
  port: 81
  http_port: 80
  https_port: 443
  config_path: "{{ docker.stacks_directory }}/nginx-proxy-manager"

# Uptime Kuma Monitoring
uptime_kuma:
  port: 3001
  config_path: "{{ docker.stacks_directory }}/uptime-kuma"
  data_path: "{{ docker.stacks_directory }}/uptime-kuma/data"

# Samba File Sharing
samba:
  workgroup: "WORKGROUP"
  server_string: "Pi Home Server"
  netbios_name: "PISERVER"

# Glances System Monitoring
glances:
  port: 61208
  config_path: "{{ docker.stacks_directory }}/glances"

# Home Assistant Home Automation
home_assistant:
  port: 8123
  domain: "has.{{ ddns_domain }}"
  config_path: "{{ docker.stacks_directory }}/home-assistant"
  data_path: "{{ docker.stacks_directory }}/home-assistant/config"
  ga_service_account_id: "{{ google_home_assistant_service_account_id }}"
  timezone: "{{ system.timezone }}"
  mqtt:
    image: "eclipse-mosquitto:2.1.2-alpine"
    port: 1883
    config_path: "{{ docker.stacks_directory }}/home-assistant/mosquitto/config"
    data_path: "{{ docker.stacks_directory }}/home-assistant/mosquitto/data"
  thread:
    image: "openthread/border-router:latest"
    device: "/dev/serial/by-id/usb-Nabu_Casa_ZBT-2_E072A1D74B14-if00"
    data_path: "{{ home_assistant.config_path }}/otbr"
    backbone_interface: "eth0"
    baudrate: 460800
    hardware_flow_control: true
    # otbr-agent log level: EMERG=0 ALERT=1 CRIT=2 ERR=3 WARNING=4 NOTICE=5
    # INFO=6 DEBUG=7. The image defaults to 7, which wrote about 15 MiB each day
    # of RadioSelector and DataPollHandlr lines. NOTICE keeps the useful events.
    log_level: 5
    rest_api:
      listen_address: "127.0.0.1"
      port: 18081
    web:
      listen_address: "127.0.0.1"
      port: 18080
  matter:
    image: "ghcr.io/matter-js/python-matter-server:stable"
    data_path: "{{ home_assistant.config_path }}/matter"
    port: 5581
  yandex_smart_home:
    enabled: true
    pc:
      entity_id: "switch.pc"
      availability_topic: "homeassistant/sensor/TV-satellite/availability"
      startup_button_entity_id: "button.media_pc_power_switch_pc_power_button"
      shutdown_button_entity_id: "button.tv_satellite_shutdown"
      startup_duration: "00:01:00"
      name: "Компьютер"
      room: "Гостиная"
    vacuum:
      entity_id: "vacuum.s7"
      name: "Пылесос"
      room: "Гостиная"

# Frigate NVR
frigate:
  port: 8971
  config_path: "{{ docker.stacks_directory }}/frigate"
  media_path: "{{ storage.mount_point }}/frigate"
  camera_name: "calex_doorbell"
  retention_days: 3

# Obsidian LiveSync
obsidian_livesync:
  port: 5984
  domain: "vault.{{ ddns_domain }}"
  config_path: "{{ docker.stacks_directory }}/obsidian-livesync"

# Vaultwarden Password Manager
vaultwarden:
  version: "1.37.1"
  port: 11011
  domain: "vwdn.{{ ddns_domain }}"
  config_path: "{{ docker.stacks_directory }}/vaultwarden"
  data_path: "{{ docker.stacks_directory }}/vaultwarden/data"
  # Backup Configuration
  backup:
    local_directory: "{{ storage.mount_point }}/backups/vaultwarden"
    retention_days: 3
    rclone_path: "vaultwarden-backups"
    log_file: "{{ log_directory }}/vaultwarden-backup-rclone.log"

# Sharepaste Clipboard Sync
sharepaste:
  port: 8443
  domain: "clip.{{ ddns_domain }}"
  config_path: "{{ docker.stacks_directory }}/sharepaste"
  data_path: "{{ docker.stacks_directory }}/sharepaste/data"
  source_path: "{{ docker.stacks_directory }}/sharepaste/source"
  repo_url: "git@github.com:poalrom/sharepaste.git"
  repo_branch: "main"
  deploy_key_path: "/home/{{ users.admin_user }}/.ssh/sharepaste_deploy"
  # Backup Configuration
  backup:
    local_directory: "{{ storage.mount_point }}/backups/sharepaste"
    retention_days: 3
    rclone_path: "sharepaste-backups"
    log_file: "{{ log_directory }}/sharepaste-backup-rclone.log"

# Snuglog Household Organiser
# Only the production environment is managed here. The compose project lives in
# the git checkout itself because docker-compose.production.yml uses relative
# paths (`build: .`, `./data/production/postgres`), so the repository root has
# to be the compose project directory.
snuglog:
  port: 8133
  domain: "snuglog.{{ ddns_domain }}"
  source_path: "{{ docker.stacks_directory }}/snuglog"
  compose_file: "docker-compose.production.yml"
  repo_url: "git@github.com:poalrom/snuglog.git"
  repo_branch: "main"
  deploy_key_path: "/home/{{ users.admin_user }}/.ssh/snuglog_deploy"
  # Postgres stays on the SD card: the external disk is exFAT and cannot hold
  # postgres file ownership.
  database_directory: "{{ docker.stacks_directory }}/snuglog/data/production/postgres"
  # Posters and frames live on the external disk next to the other bulk media.
  # The compose bind uses create_host_path: false, so this directory has to
  # exist before the app starts, otherwise the container refuses to come up.
  images_directory: "{{ storage.mount_point }}/snuglog/production/watchlist-images"
  # Path inside the container; it has to match the compose bind mount target.
  container_images_directory: "/app/data/watchlist-images"
  db:
    user: "postgres"
    name: "snuglog"
    # Compose service name of the production database.
    host: "db-production"
    container: "snuglog-db-production-1"
  alice:
    oauth_client_id: "snuglog-alice-production"
    oauth_redirect_uri: "https://social.yandex.net/broker/redirect"
    # Direct access to the app port is not proxied, so only enable this while
    # Nginx Proxy Manager overwrites X-Real-IP.
    trust_proxy_ip_headers: true
    interpreter_rate_limit_per_minute: 60
  # Backup Configuration
  backup:
    local_directory: "{{ storage.mount_point }}/backups/snuglog"
    retention_days: 3
    rclone_path: "snuglog-backups"
    log_file: "{{ log_directory }}/snuglog-backup-rclone.log"

# Torrent VPN Configuration
torrent_vpn:
  config_path: "{{ docker.stacks_directory }}/qbittorrent"
  qbittorrent_config_path: "{{ docker.stacks_directory }}/qbittorrent/config"
  download_path: "{{ shared_directory }}/downloads"
  incomplete_path: "{{ storage.mount_point }}/torrents/incomplete"
  vpn_config_name: "myvpn"  # Name for WireGuard service (without .conf extension)
  qbittorrent_webui_port: 8234
  torrent_port: 45861
  # Hash of the default password "adminadmin"
  default_password: "@ByteArray(ARQ77eY1NUZaQsuDHbIMCA==:0WMRkYTUWVT9wVvdDtHAjU9b3b7uB8NR1Gur2hmQCvCDpm39Q+PsJRJPaCU51dEiz+dTzh8qbPsL8WkFljQYFQ==)"

# TinyMediaManager
tinymediamanager:
  port: 4261
  config_path: "{{ docker.stacks_directory }}/tinymediamanager"
  data_path: "{{ docker.stacks_directory }}/tinymediamanager/data"
  tvshows_media_path: "{{ shared_directory }}/tvshows"
  movies_media_path: "{{ shared_directory }}/movies"
