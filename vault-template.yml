---
# =============================================================================
# Ansible Vault Template for Sensitive Variables
# =============================================================================
# Copy this file to vault.yml and encrypt it with: ansible-vault encrypt vault.yml
# Then include it in your playbook with: vars_files: - vault.yml

# DDNS Configuration
myaddr_api_key: "YOUR_MYADDR_API_KEY_HERE"
ddns_domain: "YOUR_DDNS_DOMAIN_HERE.myaddr.tools"

# Boot notification via Telegram
# Create the bot with @BotFather. Read the chat id from
# https://api.telegram.org/bot<TOKEN>/getUpdates after you message the bot.
# An empty token disables the boot-notify role.
telegram_bot_token: "YOUR_TELEGRAM_BOT_TOKEN_HERE"
telegram_chat_id: "YOUR_TELEGRAM_CHAT_ID_HERE"

# Service Passwords
# MQTT Broker Credentials
mqtt_broker_username: "homeassistant"
mqtt_broker_password: "CHANGE_ME"

samba_password: "YOUR_SAMBA_PASSWORD_HERE"

# Immich Passwords
immich_db_password: "YOUR_IMMICH_DB_PASSWORD_HERE"

# Obsidian LiveSync Configuration
# username is provided via vault because the db is publicly accessible
obsidian_livesync_db_user: "your-couchdb-user"
obsidian_livesync_db_password: "your-couchdb-password"
obsidian_livesync_passphrase: "your-obsidian-livesync-passphrase"

# Nginx Proxy Manager Configuration
nginx_proxy_manager_admin_email: "admin@example.com"
nginx_proxy_manager_admin_password: "changeme"

# Yandex Disk Configuration
yandex_disk_token: 'YOUR_YANDEX_DISK_OAUTH_TOKEN_HERE'

# Google <-> HA Configuration
google_home_assistant_service_account_id: 'my-app-123'
google_home_assistant_service_account_token: '{service_account_json_here}'

# Snuglog Household Organiser
snuglog_db_password: "YOUR_SNUGLOG_DB_PASSWORD_HERE"
snuglog_better_auth_secret: "YOUR_SNUGLOG_BETTER_AUTH_SECRET_HERE"
snuglog_google_auth_id: "your-google-client-id"
snuglog_google_auth_secret: "your-google-client-secret"
snuglog_alice_skill_id: "YOUR_YANDEX_ALICE_SKILL_ID_HERE"
snuglog_alice_oauth_client_secret: "YOUR_SNUGLOG_ALICE_OAUTH_CLIENT_SECRET_HERE"
snuglog_cerebras_api_key: "YOUR_CEREBRAS_API_KEY_HERE"
snuglog_tmdb_api_key: "YOUR_TMDB_API_READ_ACCESS_TOKEN_HERE"

# GitHub Container Registry, for the Snuglog production image
# Create a classic token with the read:packages scope, or a fine-grained token
# with read access to the snuglog package. An empty token is accepted only
# while the Pi already holds a docker login for ghcr.io.
ghcr_token: "YOUR_GITHUB_READ_PACKAGES_TOKEN_HERE"

# Frigate Camera Streams
frigate_doorbell_rtsp_url: "rtsp://username:password@192.168.178.37:88/videoMain"
