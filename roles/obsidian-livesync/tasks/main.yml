- name: Create obsidian-livesync directory
  ansible.builtin.file:
    path: "{{ obsidian_livesync.config_path }}"
    state: directory
    mode: "0755"

- name: Template docker-compose for obsidian-livesync
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ obsidian_livesync.config_path }}/docker-compose.yml"
    mode: "0644"
  notify: Restart obsidian-livesync

- name: Start obsidian-livesync
  community.docker.docker_compose_v2:
    project_src: "{{ obsidian_livesync.config_path }}"
    state: present

- name: Wait for CouchDB to be ready
  ansible.builtin.wait_for:
    host: "127.0.0.1"
    port: "{{ obsidian_livesync.port }}"
    delay: 10
    timeout: 60

- name: Read the CouchDB cluster setup state
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ obsidian_livesync.port }}/_cluster_setup"
    user: "{{ obsidian_livesync_db_user }}"
    password: "{{ obsidian_livesync_db_password }}"
    force_basic_auth: true
  register: obsidian_livesync_cluster_state
  changed_when: false

- name: Enable the CouchDB single node setup
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ obsidian_livesync.port }}/_cluster_setup"
    method: POST
    user: "{{ obsidian_livesync_db_user }}"
    password: "{{ obsidian_livesync_db_password }}"
    force_basic_auth: true
    body_format: json
    body:
      action: enable_single_node
      username: "{{ obsidian_livesync_db_user }}"
      password: "{{ obsidian_livesync_db_password }}"
      bind_address: "0.0.0.0"
      port: "{{ obsidian_livesync.port | int }}"
      singlenode: true
    status_code: [200, 201]
  when: obsidian_livesync_cluster_state.json.state != "single_node_enabled"

- name: Read the CouchDB settings that Obsidian LiveSync requires
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ obsidian_livesync.port }}/_node/_local/_config/{{ item.section }}/{{ item.key }}"
    user: "{{ obsidian_livesync_db_user }}"
    password: "{{ obsidian_livesync_db_password }}"
    force_basic_auth: true
    status_code: [200, 404]
  loop: "{{ obsidian_livesync_couchdb_settings }}"
  loop_control:
    label: "{{ item.section }}/{{ item.key }}"
  register: obsidian_livesync_current_settings
  changed_when: false

- name: Apply the CouchDB settings that Obsidian LiveSync requires
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ obsidian_livesync.port }}/_node/_local/_config/{{ item.item.section }}/{{ item.item.key }}"
    method: PUT
    user: "{{ obsidian_livesync_db_user }}"
    password: "{{ obsidian_livesync_db_password }}"
    force_basic_auth: true
    body_format: json
    body: "{{ item.item.value }}"
  loop: "{{ obsidian_livesync_current_settings.results }}"
  loop_control:
    label: "{{ item.item.section }}/{{ item.item.key }}"
  when: item.status == 404 or item.json != item.item.value

- name: Install Deno
  tags: ["skip_ansible_lint"]
  ansible.builtin.shell: |
    curl -fsSL https://deno.land/install.sh | sh

- name: Generate Obsidian LiveSync setup URI
  ansible.builtin.shell: |
    {{ ansible_env.HOME }}/.deno/bin/deno run -A https://raw.githubusercontent.com/vrtmrz/obsidian-livesync/main/utils/flyio/generate_setupuri.ts
  environment:
    hostname: "https://{{ obsidian_livesync.domain }}"
    database: "obsidian-livesync"
    passphrase: "{{ obsidian_livesync_passphrase }}"
    username: "{{ obsidian_livesync_db_user }}"
    password: "{{ obsidian_livesync_db_password }}"
  register: setup_uri_result
  changed_when: false

- name: Display setup URI
  ansible.builtin.debug:
    msg: "{{ setup_uri_result.stdout }}"
