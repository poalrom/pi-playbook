---

# Bookworm ships the exFAT userspace tools as `exfatprogs`. The former
# `exfat-utils` is gone and `exfat-progs` never existed, so the old loop failed
# on every run and `ignore_errors` hid it. The kernel supplies the exFAT driver,
# so this package matters for one reason: it provides `fsck.exfat`, which
# systemd runs at boot because the fstab entry below uses passno 2. Without
# this task the package survives only as an automatic dependency, which
# `apt autoremove` can take away, leaving the boot check with no helper.
- name: Install exFAT tools
  ansible.builtin.apt:
    name: exfatprogs
    state: present

- name: Create mount directory for {{ storage.device }}
  ansible.builtin.file:
    path: "{{ storage.mount_point }}"
    state: directory
    mode: '0755'
    owner: "{{ users.admin_user }}"
    group: "{{ users.admin_user }}"

- name: Mount {{ storage.device }} to {{ storage.mount_point }}
  ansible.posix.mount:
    src: "{{ storage.device }}"
    path: "{{ storage.mount_point }}"
    fstype: "{{ storage.filesystem }}"
    state: mounted
    opts: defaults,uid=1000,gid=1000,dmask=000,fmask=111,nofail
    dump: 0
    passno: 2
  tags: ["skip_ansible_lint"]

- name: Create shared shell library directory
  ansible.builtin.file:
    path: "{{ storage_guard_script | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Sourced by every backup script. It has to be in place before the service
# roles install their backup scripts, and this role already runs before them.
- name: Install storage mount guard for the backup scripts
  ansible.builtin.template:
    src: require-storage-mount.sh.j2
    dest: "{{ storage_guard_script }}"
    owner: root
    group: root
    mode: "0644"
