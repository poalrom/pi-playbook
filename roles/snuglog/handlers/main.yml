---
# The image comes from the registry, so a restart never builds. The pull is
# the job of the role, which resolves the tag of the deployed commit first.
- name: Restart snuglog
  community.docker.docker_compose_v2:
    project_src: "{{ snuglog.source_path }}"
    files:
      - "{{ snuglog.compose_file }}"
    state: present
    recreate: always
