---
# Reuse the locally built image; service.yml builds and migrates before start.
- name: Restart snuglog
  community.docker.docker_compose_v2:
    project_src: "{{ snuglog.source_path }}"
    files:
      - "{{ snuglog.compose_file }}"
      - "{{ snuglog.security_compose_file }}"
    state: present
    build: never
    recreate: always
