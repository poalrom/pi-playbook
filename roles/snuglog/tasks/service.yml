---
# The compose project name comes from the directory name ("snuglog"), which is
# what the existing containers already carry. Naming it explicitly would create
# a second set of containers and collide on port {{ snuglog.port }}.
#
# `remove_orphans` stays off on purpose: the unmanaged staging containers share
# this project name and must not be torn down by a production deploy.
#
# The app image is built locally with a managed Node/CA stage before migrations.

- name: Render snuglog env.production
  ansible.builtin.template:
    src: env.production.j2
    dest: "{{ snuglog.source_path }}/env.production"
    owner: "{{ users.admin_user }}"
    group: "{{ users.admin_user }}"
    mode: "0600"
  notify: Restart snuglog

- name: Read the upstream snuglog Dockerfile
  ansible.builtin.slurp:
    src: "{{ snuglog.source_path }}/Dockerfile"
  register: snuglog_dockerfile

- name: Pin the production Node runtime and CA trust
  ansible.builtin.template:
    src: Dockerfile.security.j2
    dest: "{{ snuglog.source_path }}/Dockerfile.security"
    owner: "{{ users.admin_user }}"
    group: "{{ users.admin_user }}"
    mode: "0644"

- name: Render the local production compose file
  ansible.builtin.template:
    src: docker-compose.local.yml.j2
    dest: "{{ snuglog.source_path }}/{{ snuglog.compose_file }}"
    owner: "{{ users.admin_user }}"
    group: "{{ users.admin_user }}"
    mode: "0644"

- name: Render the production database TLS runtime override
  ansible.builtin.template:
    src: docker-compose.security.yml.j2
    dest: "{{ snuglog.source_path }}/{{ snuglog.security_compose_file }}"
    owner: "{{ users.admin_user }}"
    group: "{{ users.admin_user }}"
    mode: "0644"
  notify: Restart snuglog

# Build before changing any running container or applying database migrations.
# The old container keeps its image while the new tag is being built.
- name: Build the snuglog production image
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ snuglog.compose_file }} -f {{ snuglog.security_compose_file }}
      build {{ snuglog.app_service }}
    chdir: "{{ snuglog.source_path }}"
  become: true
  become_user: "{{ users.admin_user }}"
  changed_when: true

# The runtime image only starts the server; it never migrates. The Better Auth
# MCP plugin reads its own tables during boot, so an unmigrated database makes
# every request answer 500. Bring the database up alone, migrate, then start
# the app.
- name: Start snuglog production database
  community.docker.docker_compose_v2:
    project_src: "{{ snuglog.source_path }}"
    files:
      - "{{ snuglog.compose_file }}"
      - "{{ snuglog.security_compose_file }}"
    services:
      - db-production
    state: present
    wait: true

# Both migration commands report "ok" on purpose: drizzle-kit prints the same
# text whether or not work was needed, so neither run can tell a real change
# from a no-op. The bootstrap stamps a schema that predates the migration
# table and does nothing on every later run.
- name: Stamp the snuglog baseline schema
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ snuglog.compose_file }} -f {{ snuglog.security_compose_file }} run --rm --no-deps
      {{ snuglog.app_service }} {{ snuglog.bootstrap_command }}
    chdir: "{{ snuglog.source_path }}"
  become: true
  become_user: "{{ users.admin_user }}"
  register: snuglog_bootstrap
  changed_when: false

- name: Apply snuglog database migrations
  ansible.builtin.command:
    cmd: >-
      docker compose -f {{ snuglog.compose_file }} -f {{ snuglog.security_compose_file }} run --rm --no-deps
      {{ snuglog.app_service }} {{ snuglog.migrate_command }}
    chdir: "{{ snuglog.source_path }}"
  become: true
  become_user: "{{ users.admin_user }}"
  register: snuglog_migrate
  changed_when: false

- name: Report migration output
  ansible.builtin.debug:
    msg: "{{ snuglog_bootstrap.stdout_lines + snuglog_migrate.stdout_lines }}"

- name: Start snuglog production
  community.docker.docker_compose_v2:
    project_src: "{{ snuglog.source_path }}"
    files:
      - "{{ snuglog.compose_file }}"
      - "{{ snuglog.security_compose_file }}"
    state: present
    build: never

- name: Wait for snuglog to listen
  ansible.builtin.wait_for:
    host: "{{ network.pi_ip }}"
    port: "{{ snuglog.port }}"
    delay: 5
    timeout: 120

- name: Display snuglog access information
  ansible.builtin.debug:
    msg:
      - "Snuglog production is now running!"
      - "Local Access: http://{{ network.pi_ip }}:{{ snuglog.port }}"
      - "Public Domain: https://{{ snuglog.domain }} (proxied by Nginx Proxy Manager)"
      - "Image: {{ snuglog.image }} (built from {{ snuglog_source_state.after }})"
      - "Database Cluster: {{ snuglog.database_directory }}"
      - "Watchlist Images: {{ snuglog.images_directory }}"
      - "Shopping Images: {{ snuglog.shopping_images_directory }}"
      - "Source Directory: {{ snuglog.source_path }}"
      - "Database migrations are applied by this role before the app starts."
      - "After first deploy: enable SSL for {{ snuglog.domain }} in the NPM UI."
