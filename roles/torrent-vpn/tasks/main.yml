---
# =============================================================================
# Torrent and VPN Setup
# =============================================================================

- name: Create torrents directory structure
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ users.admin_user }}"
    group: "{{ users.admin_user }}"
    mode: '0755'
  loop:
    - "{{ torrent_vpn.download_path }}"
    - "{{ torrent_vpn.incomplete_path }}"

- name: Install required packages
  ansible.builtin.apt:
    name:
      - wireguard
      - wireguard-tools
    state: present
    update_cache: true

- name: Create qBittorrent Docker stack directory
  ansible.builtin.file:
    path: "{{ torrent_vpn.config_path }}"
    state: directory
    owner: "{{ users.admin_user }}"
    group: "{{ users.admin_user }}"
    mode: '0755'

- name: Create qBittorrent config directory
  ansible.builtin.file:
    path: "{{ torrent_vpn.qbittorrent_config_path }}"
    state: directory
    owner: "{{ users.admin_user }}"
    group: "{{ users.admin_user }}"
    mode: '0755'

- name: Look for the WireGuard config on the controller
  ansible.builtin.stat:
    path: "{{ role_path }}/files/{{ torrent_vpn.vpn_config_name }}.conf"
  register: torrent_vpn_local_config
  delegate_to: localhost
  become: false
  changed_when: false

- name: Look for the deployed WireGuard config
  ansible.builtin.stat:
    path: "{{ torrent_vpn.config_path }}/{{ torrent_vpn.vpn_config_name }}.conf"
  register: torrent_vpn_remote_config
  changed_when: false

- name: Fail when no WireGuard config is available
  ansible.builtin.fail:
    msg: >-
      {{ torrent_vpn.vpn_config_name }}.conf is absent both in
      roles/torrent-vpn/files/ on the controller and in
      {{ torrent_vpn.config_path }} on the host. Gluetun cannot start without
      it. Place the WireGuard config in roles/torrent-vpn/files/ and run again.
  when:
    - not torrent_vpn_local_config.stat.exists
    - not torrent_vpn_remote_config.stat.exists

- name: Copy WireGuard config file
  ansible.builtin.copy:
    src: "{{ torrent_vpn.vpn_config_name }}.conf"
    dest: "{{ torrent_vpn.config_path }}/{{ torrent_vpn.vpn_config_name }}.conf"
    mode: '0600'
  when: torrent_vpn_local_config.stat.exists

- name: Get admin user UID
  ansible.builtin.command: id -u {{ users.admin_user }}
  register: admin_user_uid_result
  changed_when: false

- name: Get admin user GID
  ansible.builtin.command: id -g {{ users.admin_user }}
  register: admin_user_gid_result
  changed_when: false

- name: Set admin user UID/GID facts
  ansible.builtin.set_fact:
    admin_user_uid: "{{ admin_user_uid_result.stdout }}"
    admin_user_gid: "{{ admin_user_gid_result.stdout }}"

- name: Create qBittorrent docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ torrent_vpn.config_path }}/compose.yml"
    owner: "{{ users.admin_user }}"
    group: "{{ users.admin_user }}"
    mode: '0644'
  notify: Restart qbittorrent

- name: Configure qBittorrent
  ansible.builtin.ini_file:
    path: "{{ torrent_vpn.qbittorrent_config_path }}/qBittorrent/qBittorrent.conf"
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: "{{ users.admin_user }}"
    group: "{{ users.admin_user }}"
    mode: '0644'
  with_items:
    - { section: "BitTorrent", option: "Session\\AddTorrentStopped", value: "true" }
    - { section: "BitTorrent", option: "Session\\AnonymousModeEnabled", value: "true" }
    - { section: "BitTorrent", option: "Session\\GlobalMaxRatio", value: "1e-06" }
    - { section: "BitTorrent", option: "Session\\DefaultSavePath", value: "/downloads" }
    - { section: "BitTorrent", option: "Session\\TempPath", value: "/incomplete" }
    - { section: "BitTorrent", option: "Session\\TempPathEnabled", value: "true" }
    - { section: "Preferences", option: "WebUI\\Port", value: "{{ torrent_vpn.qbittorrent_webui_port }}" }

- name: Read the qBittorrent configuration
  ansible.builtin.slurp:
    src: "{{ torrent_vpn.qbittorrent_config_path }}/qBittorrent/qBittorrent.conf"
  register: torrent_vpn_qbittorrent_conf
  failed_when: false
  changed_when: false

- name: Seed the qBittorrent WebUI password when none is set
  ansible.builtin.ini_file:
    path: "{{ torrent_vpn.qbittorrent_config_path }}/qBittorrent/qBittorrent.conf"
    section: "Preferences"
    option: "WebUI\\Password_PBKDF2"
    value: "{{ torrent_vpn.default_password }}"
    owner: "{{ users.admin_user }}"
    group: "{{ users.admin_user }}"
    mode: '0644'
  when: >-
    torrent_vpn_qbittorrent_conf.content is not defined
    or 'Password_PBKDF2' not in (torrent_vpn_qbittorrent_conf.content | b64decode)

- name: Start qBittorrent Docker stack
  community.docker.docker_compose_v2:
    project_src: "{{ torrent_vpn.config_path }}"
    state: present
