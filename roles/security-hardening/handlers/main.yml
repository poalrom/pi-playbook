---
# =============================================================================
# Security Hardening Handlers
# =============================================================================

- name: Restart ssh
  ansible.builtin.systemd:
    name: ssh
    state: restarted
  listen: "restart ssh"

- name: Restart fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    state: restarted
  listen: "restart fail2ban"

- name: Restart journald
  ansible.builtin.systemd:
    name: systemd-journald
    state: restarted
  listen: "restart journald"

# Switching Storage to persistent does not move the live journal off /run by itself;
# without an explicit flush the change only takes effect at the next boot.
- name: Flush journal to persistent storage
  ansible.builtin.command: journalctl --flush
  changed_when: true
  listen: "restart journald"

- name: Reboot if needed
  ansible.builtin.reboot:
    reboot_timeout: 30
    test_command: uptime
  listen: "reboot if needed"
  when: system_upgrade.changed and (system_upgrade.stdout is search("linux-image") or system_upgrade.stdout is search("kernel"))
